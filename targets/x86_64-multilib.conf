# Arch Linux, x86_64, multilib.
#
# Mirrored to ghcr.io/pkgforge-dev/mirror-archlinux/x86_64/multilib.
# Read by scripts/lib.sh, never sourced. One key per line, `key = value`.

arch = x86_64
repo = multilib

# Servers that may supply the database, tried in order. Arch Linux runs both,
# so a database is taken only from the distribution's own hosts.
db_server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
db_server = https://fastly.mirror.pkgbuild.com/$repo/os/$arch

# More servers package bytes may come from, after the db_servers. Every byte
# is checked against the database's sha256 and size before it is pushed, so
# any mirror will do here.
server = https://mirrors.logal.dev/archlinux/$repo/os/$arch
server = https://arch.mirror.constant.com/$repo/os/$arch
server = https://ftp.halifax.rwth-aachen.de/archlinux/$repo/os/$arch
server = https://mirrors.rit.edu/archlinux/$repo/os/$arch

# pacman verifies in the x86_64 Arch image, with Architecture set to the
# target's arch: no emulation.
# tag: base
verify_image = docker.io/library/archlinux:base@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
verify_platform = linux/amd64

# The trust root is the verify image's own keyring. The keyring package is in
# core: verify installs it from the promoted x86_64 core first.
keyring = archlinux-keyring
keyring_from = x86_64-core
