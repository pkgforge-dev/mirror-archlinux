# ArchPOWER, powerpc64le, base-any.
#
# Mirrored to ghcr.io/pkgforge-dev/mirror-archlinux/powerpc64le/base-any.
# Read by scripts/lib.sh, never sourced. One key per line, `key = value`.

arch = powerpc64le
repo = base-any

# The any database is at base/any, not at $repo/$arch: it is the one database
# the three arches share. It is mirrored once per arch so a consumer keeps one
# Server line for both sections, and so keyring_from may name a target of the
# same arch, which scripts/lib.sh refuses otherwise.
db_server = https://repo.archlinuxpower.org/base/any
db_signed = yes

# tag: base
verify_image = docker.io/library/archlinux:base@sha256:52dfbd5afb23a220d5ee92dafcb4c788d96c026ed04179890c23adef4c897fa0
verify_platform = linux/amd64

# tag: ppc64le
keyring_image = ghcr.io/pkgforge-dev/archlinux:ppc64le@sha256:bd1728e793d978b2783a0ebfa2c12e1ad9638e57791154f8657a5d2b2ca69a55
keyring_platform = linux/ppc64le

# The keyring package is in this repository, so no keyring_from.
keyring = archpower-keyring