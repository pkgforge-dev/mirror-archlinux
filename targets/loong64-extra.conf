# Arch Linux for Loong64 (LCPU), loong64, extra.
#
# Mirrored to ghcr.io/pkgforge-dev/mirror-archlinux/loong64/extra.
# Read by scripts/lib.sh, never sourced. One key per line, `key = value`.

arch = loong64
repo = extra

# ⚠ pacman refuses four of its files from upstream too (2026-10-14):
# compiler-rt18-18.1.8-1, x11-ssh-askpass-1.2.4.1-8 and yt6801-dkms-1.0.28-3
# are signed by keys that have expired, and python-xarray-2026.07.0-1 has no
# %PGPSIG% and no .sig on any server. verify lists them as upstream-refused
# and passes the batch: the mirror serves exactly upstream's files.

# The port's own server: its homepage and status page, and the first entry of
# its first mirrorlist (lcpu-club/loongarch-packages 3cb951f633). Cloudflare is
# in front of it.
db_server = https://loongarchlinux.lcpu.dev/loongarch/archlinux/$repo/os/$arch

# The rest of pacman-mirrorlist-loong64-20250718-1. All five served the same
# core.db and extra.db as the db_server on 2026-10-14.
server = https://mirrors.wsyu.edu.cn/loongarch/archlinux/$repo/os/$arch
server = https://mirrors.pku.edu.cn/loongarch-lcpu/archlinux/$repo/os/$arch
server = https://mirrors.nju.edu.cn/loongarch/archlinux/$repo/os/$arch
server = https://mirrors.pku.edu.cn/loongarch/archlinux/$repo/os/$arch
server = https://mirror.iscas.ac.cn/loongarch/archlinux/$repo/os/$arch

# pacman verifies in the x86_64 Arch image, with Architecture set to the
# target's arch: no emulation.
# tag: base
verify_image = docker.io/library/archlinux:base@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
verify_platform = linux/amd64

# The trust root: the keyring files of the loong64 image of
# pkgforge-dev/docker-archlinux (archlinux-lcpu.gpg and its trust), copied out
# of it and never run. The x86_64 image keeps its own archlinux keyring, which
# signs the port's any packages.
# tag: loong64
keyring_image = ghcr.io/pkgforge-dev/archlinux:loong64@sha256:493c2d153bb1b6b4ea3ff07a22bc63516807d1038473994f3f9e04ba9c01e50c
keyring_platform = linux/loong64

# Both keyring packages are in core: verify installs them from the promoted
# loong64 core first.
keyring = archlinux-keyring archlinux-lcpu-keyring
keyring_from = loong64-core
