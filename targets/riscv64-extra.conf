# Arch Linux RISC-V, riscv64, extra.
#
# Mirrored to ghcr.io/pkgforge-dev/mirror-archlinux/riscv64/extra.
# Read by scripts/lib.sh, never sourced. One key per line, `key = value`.

arch = riscv64
repo = extra

# ⚠ Upstream's extra.db holds ntk-1.3.1001-4/desc as a GNU sparse member of
# 576 NUL bytes (2024-09-23), on every current mirror. pacman lists it with
# every field None and cannot download it. plan passes over it and names it
# (lib.sh db_check).

# The port's own servers. riscv.mirror.pkgbuild.com is on Arch Linux's mirror
# network and the port lists it as recommended; archriscv.felixc.at is the
# port's homepage. Both served the same databases on 2026-10-14.
db_server = https://riscv.mirror.pkgbuild.com/repo/$repo
db_server = https://archriscv.felixc.at/repo/$repo

# Mirrors from the port's homepage: current first, then those a few hours
# behind on 2026-10-14. Left out: mirror.iscas.ac.cn/archriscv (databases of
# 2026-09-27) and mirrors.felixc.at/archriscv (databases of 2026-02-26).
server = https://mirrors.wsyu.edu.cn/archriscv/repo/$repo
server = https://mirror.nyist.edu.cn/archriscv/repo/$repo
server = https://mirrors.ic.unicamp.br/archriscv/repo/$repo
server = https://mirror.ufscar.br/archriscv/repo/$repo
server = https://archriscv.paulsajna.com/repo/$repo
server = https://mirror.nju.edu.cn/archriscv/repo/$repo
server = https://mirrors.pku.edu.cn/archriscv/repo/$repo
server = https://mirrors.sustech.edu.cn/archriscv/repo/$repo

# pacman verifies in the x86_64 Arch image, with Architecture set to the
# target's arch: no emulation.
# tag: base
verify_image = docker.io/library/archlinux:base@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
verify_platform = linux/amd64

# The trust root: the keyring files of the riscv64 image of
# pkgforge-dev/docker-archlinux, copied out of it and never run. Every
# signature in the port is by a key in archlinux.gpg (2026-10-14), which the
# x86_64 image keeps as its own; the image follows the port if that changes.
# tag: riscv64
keyring_image = ghcr.io/pkgforge-dev/archlinux:riscv64@sha256:d2b71c9ac98971be75e0e4b29b6bb24dea2e3b302dfc27288567193bf16091d4
keyring_platform = linux/riscv64

# The keyring package is in core: verify installs it from the promoted
# riscv64 core first.
keyring = archlinux-keyring
keyring_from = riscv64-core
