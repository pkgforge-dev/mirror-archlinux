# ArchPOWER, powerpc64, base.
#
# Mirrored to ghcr.io/pkgforge-dev/mirror-archlinux/powerpc64/base.
# Read by scripts/lib.sh, never sourced. One key per line, `key = value`.

arch = powerpc64
repo = base

# ArchPOWER publishes from one host and signs every database. db_signed = yes
# lets verify use DatabaseRequired, so pacman refuses a database it cannot
# check.
db_server = https://repo.archlinuxpower.org/$repo/$arch
db_signed = yes

# tag: base
verify_image = docker.io/library/archlinux:base@sha256:b1c2fe6e717bfd5673af8fc217e1e1c3ce0dcbb1d53c3414c8425e7ce79fc6d9
verify_platform = linux/amd64

# tag: ppc64
keyring_image = ghcr.io/pkgforge-dev/archlinux:ppc64@sha256:55fd0e0cf3513a5bb25c74b031ceae830de12e55dcd595556b13bddc5ecc6fd9
keyring_platform = linux/ppc64

# The keyring package is in base-any. keyring_from names that target of this
# same arch, so verify installs the current archpower-keyring before it checks
# any package, and a packager key added after the image was built still
# verifies.
keyring = archpower-keyring
keyring_from = powerpc64-base-any