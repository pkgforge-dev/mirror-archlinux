# Arch Linux ARM, aarch64, aur.
#
# Mirrored to ghcr.io/pkgforge-dev/mirror-archlinux/aarch64/aur.
# Read by scripts/lib.sh, never sourced. One key per line, `key = value`.

arch = aarch64
repo = aur

# ⚠ Arch Linux ARM serves no database over https from its own hosts:
# mirror.archlinuxarm.org is a plain http GeoIP redirector to the official
# mirrors. These are official mirrors that answer https under the name
# archlinuxarm.org gives them, push synchronised from the project, run by three
# operators.
db_server = https://fl.us.mirror.archlinuxarm.org/$arch/$repo
db_server = https://ca.us.mirror.archlinuxarm.org/$arch/$repo
db_server = https://de3.mirror.archlinuxarm.org/$arch/$repo

# Official mirrors, over https under their sponsors' own names.
server = https://mirrors.dotsrc.org/archlinuxarm/$arch/$repo
server = https://mirror.united-gameserver.de/archlinux-arm/$arch/$repo
server = https://free.nchc.org.tw/archlinuxarm/$arch/$repo

# pacman verifies in the x86_64 Arch image, with Architecture set to the
# target's arch: no emulation.
# tag: base
verify_image = docker.io/library/archlinux:base@sha256:e43f1fd80e073992c5f173efbbbf65144170bf60aeb7369940087d63eacea8f4
verify_platform = linux/amd64

# The trust root: the keyring files of the aarch64 image of
# pkgforge-dev/docker-archlinux (archlinuxarm.gpg and its trust), copied out
# of it and never run. The x86_64 image keeps its own archlinux keyring.
# tag: aarch64
keyring_image = ghcr.io/pkgforge-dev/archlinux:aarch64@sha256:da3c0b6848324696acb119d2df1c80f65add9cad16e51ef1e6757f7899d58bd4
keyring_platform = linux/arm64

# The keyring package is in core: verify installs it from the promoted
# aarch64 core first.
keyring = archlinuxarm-keyring
keyring_from = aarch64-core
