# Measure the outcome, not the runs: has each target's latest stopped
# following upstream? Have the schedules stopped firing? Has the status
# record, or its copy on Pages, stopped moving?
#
# ⭐ sync.yml's keepalive job runs the same schedule checks, so each workflow
# witnesses the other. A schedule that stops firing leaves no run behind to
# fail; this is the run that notices.
#
# Once a day. The hourly Worker check is a job of status.yml.
name: Watchdog

on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: watchdog
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  staleness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: a target added less than the tolerance ago,
          # with nothing promoted yet, is new, not stale.
          fetch-depth: 0
      - name: Install the fetcher clients, so the powerpc targets read upstream
        run: |
          # check-staleness reads every enabled target's upstream through
          # scripts/upstream-db, and the powerpc (ArchPOWER) hosts refuse the
          # runner's own address with a 403. A full browser is needed, not just
          # curl: after a day of mirroring the runner's address and the
          # api.rv.pkgforge.dev proxy can both be rate-flagged, and only chromium
          # (a real browser that solves the challenge and keeps its clearance
          # cookie) still reads. curl-impersonate (patched curl) reads cheaply
          # when it can, directly or through the proxy; chromium is the fallback
          # for when both are refused. Both best-effort, as sync.yml does: a
          # client-install hiccup leaves MIRROR_FETCHER unset and the powerpc
          # targets read with curl and go to error on their own.
          imp=0; chr=0
          fetchers/install.sh curl-impersonate || imp=$?
          PLAYWRIGHT_WITH_DEPS=1 fetchers/install.sh chromium || chr=$?
          [ "$imp" -eq 0 ] || echo "::notice::curl-impersonate did not install (status $imp)"
          [ "$chr" -eq 0 ] || echo "::notice::chromium did not install (status $chr)"
          if [ "$imp" -eq 0 ] || [ "$chr" -eq 0 ]; then
            echo "MIRROR_FETCHER=$GITHUB_WORKSPACE/fetchers/fetcher.sh" >> "$GITHUB_ENV"
          else
            echo "::warning::no browser-profile client installed; powerpc targets read upstream with curl and may go to error"
          fi
      # scripts/check-staleness ends within STALENESS_BUDGET (600 s). The step
      # limit is above it and below the job's, so the step after this one
      # still runs when this one is stopped. Exit 3 (a target stale or
      # unknown) keeps the run red.
      - name: Check every target follows upstream
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_REGISTRY: ghcr.io
        run: scripts/check-staleness "$RUNNER_TEMP/staleness"
      # One issue per target, raised while it is stale and closed when it is
      # not; the body says what was measured and how to reproduce it.
      # always(): a check that failed or was stopped leaves the states it
      # reached, and each of them still raises or clears its issue.
      - name: Raise or clear stale-<target>
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          states=("$RUNNER_TEMP"/staleness/*.state)
          echo "${#states[@]} target state(s) written by scripts/check-staleness"
          for f in "${states[@]}"; do
            t="$(basename "$f" .state)"
            case "$(cat "$f")" in
              stale | unknown)
                scripts/track-issue raise "stale-$t" "$t: the mirror has stopped following upstream" "$RUNNER_TEMP/staleness/$t.md"
                ;;
              *)
                scripts/track-issue clear "stale-$t" "\`$t\` follows upstream again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                ;;
            esac
          done
      # From outside status.yml: a status.yml that stops running leaves no
      # run to say so. status-down when the record on branch status is old,
      # pages-stale when the copy on Pages trails it. Exit 3 keeps the run red.
      - name: Check the status record and its copy on Pages
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          git ls-remote --exit-code --heads origin status > "$RUNNER_TEMP/heads.txt" || rc=$?
          case "$rc" in
            0)
              # No --depth: in this full clone it would make the clone
              # shallow. The branch is one orphan commit.
              git fetch --quiet origin status
              if git cat-file -e FETCH_HEAD:status.json; then
                git show FETCH_HEAD:status.json > "$RUNNER_TEMP/status-branch.json"
              fi
              ;;
            2) echo "no status branch: status.yml has recorded nothing" ;;
            *)
              echo "::error::git ls-remote origin status ended $rc"
              exit "$rc"
              ;;
          esac
          scripts/check-status-site "$RUNNER_TEMP/status-branch.json"

  schedules:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # keep-schedules-enabled, then check-schedules-fired; a schedule that
      # stopped, or a workflow disabled by hand, raises schedules-stopped.
      # Exit 3 (a schedule stopped) keeps the run red.
      - name: Keep every schedule enabled, check every schedule fired
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/watch-schedules
      # Each scheduled workflow starts the others when theirs did not fire.
      # always(): a check above that fails must not stop the restart.
      - name: Start an overdue sync or status run
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          scripts/dispatch-overdue sync.yml 240 || rc=$?
          scripts/dispatch-overdue status.yml 120 || rc=$?
          exit "$rc"
