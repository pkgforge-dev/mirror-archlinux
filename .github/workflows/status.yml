# Measure the mirror against upstream every hour, and publish the result as a
# static site: on GitHub Pages, and on the branch status.
#
#   decide  does this run also measure pacman? Yes on dispatch with
#           bench=true, and once a day: the first run from 05:00 to 08:59
#           UTC that finds no bench of the day on the status branch
#   bench   scripts/bench-consumer; its JSON goes to build as an artifact
#   build   scripts/status-collect, then scripts/status-render. On main the
#           site, history.jsonl, worker.md and bench/<date>.json go to the
#           branch status as one orphan commit, and the site to Pages as an
#           artifact
#   deploy  actions/deploy-pages, on main, when Pages takes a workflow build
#   worker  on main: raises or clears worker-down from the record build pushed
#
# ⚠ A person enables Pages once, with an admin token. GITHUB_TOKEN cannot:
#   gh api -X POST repos/pkgforge-dev/mirror-archlinux/pages -f build_type=workflow
# Until then deploy says so in a notice and deploys nothing.
#
# The status branch holds the history the next run reads. The worker job reads
# status.json and worker.md from it to raise worker-down.
name: Status

on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      bench:
        description: Also measure pacman through each path (scripts/bench-consumer)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: status
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MIRROR_REGISTRY: ghcr.io

jobs:
  # GitHub can drop a scheduled run. This hourly run starts Sync when its
  # newest run on main is older than its 3 h cron plus an hour, and the
  # watchdog when its newest run is older than a day plus two hours. No needs,
  # in either direction.
  kick:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start an overdue sync or watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          scripts/dispatch-overdue sync.yml 240 || rc=$?
          scripts/dispatch-overdue watchdog.yml 1560 || rc=$?
          exit "$rc"

  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bench: ${{ steps.decide.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether this run measures pacman
        id: decide
        env:
          BENCH_INPUT: ${{ inputs.bench }}
        run: |
          bench=false
          hour="$(date -u +%H)"
          today="$(date -u +%F)"
          last=""
          if [ "$BENCH_INPUT" = true ]; then
            bench=true
          else
            rc=0
            git ls-remote --exit-code --heads origin status > "$RUNNER_TEMP/heads.txt" || rc=$?
            case "$rc" in
              0)
                git fetch --quiet --depth 1 origin status
                if git cat-file -e FETCH_HEAD:bench.json; then
                  rc=0
                  last="$(git show FETCH_HEAD:bench.json | jq -r '.date // empty' | cut -c 1-10)" || rc=$?
                  if [ "$rc" -ne 0 ]; then
                    echo "::warning::bench.json on the status branch does not read; a new bench is due"
                    last=""
                  fi
                fi
                ;;
              2) echo "no status branch yet" ;;
              *)
                echo "::error::git ls-remote origin status ended $rc"
                exit "$rc"
                ;;
            esac
            if [ "$((10#$hour))" -ge 5 ] && [ "$((10#$hour))" -le 8 ] && [ "$last" != "$today" ]; then
              bench=true
            fi
          fi
          echo "bench: $bench (dispatch input '${BENCH_INPUT:-}', $hour:00 UTC, last bench ${last:-none}, today $today)"
          echo "bench=$bench" >> "$GITHUB_OUTPUT"

  bench:
    needs: decide
    if: ${{ needs.decide.outputs.bench == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Measure pacman through each path
        env:
          CONTAINER_RUNTIME: docker
        run: |
          mkdir -p "$RUNNER_TEMP/bench"
          scripts/bench-consumer "$RUNNER_TEMP/bench/bench.json"
          if ! jq -e '.schema == 1 and (.cases | type == "array") and (.date | type == "string")' "$RUNNER_TEMP/bench/bench.json" > "$RUNNER_TEMP/bench.check"; then
            echo "::error::scripts/bench-consumer wrote no schema 1 bench.json"
            sed -n 1,40p "$RUNNER_TEMP/bench/bench.json"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench
          path: ${{ runner.temp }}/bench
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  build:
    needs: [decide, bench]
    if: ${{ !cancelled() && needs.decide.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    # One Pages artifact name per run attempt. A re-run that runs build again
    # uploads a second artifact into the same run, and deploy-pages refuses a
    # name that two artifacts share. deploy reads the name from here, so a
    # re-run of deploy alone takes the name that build used.
    outputs:
      pages_artifact: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the history and the bench from the status branch
        run: |
          in="$RUNNER_TEMP/status"
          mkdir -p "$in"
          rc=0
          git ls-remote --exit-code --heads origin status > "$RUNNER_TEMP/heads.txt" || rc=$?
          case "$rc" in
            0)
              git clone --quiet --depth 1 --branch status --single-branch \
                "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$RUNNER_TEMP/prev"
              for f in history.jsonl bench.json; do
                if [ -f "$RUNNER_TEMP/prev/$f" ]; then
                  cp "$RUNNER_TEMP/prev/$f" "$in/$f"
                fi
              done
              if [ -d "$RUNNER_TEMP/prev/bench" ]; then
                cp -r "$RUNNER_TEMP/prev/bench" "$in/bench"
              fi
              ;;
            2) echo "no status branch yet: the history starts with this run" ;;
            *)
              echo "::error::git ls-remote origin status ended $rc"
              exit "$rc"
              ;;
          esac
          ls -la "$in"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.bench.result == 'success' }}
        with:
          name: bench
          path: ${{ runner.temp }}/bench-new
      - name: Take this run's bench
        if: ${{ needs.bench.result == 'success' }}
        run: |
          in="$RUNNER_TEMP/status"
          day="$(jq -r '.date' "$RUNNER_TEMP/bench-new/bench.json" | cut -c 1-10)"
          if ! [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::bench.json names no date: '$day'"
            exit 1
          fi
          mkdir -p "$in/bench"
          cp "$RUNNER_TEMP/bench-new/bench.json" "$in/bench.json"
          cp "$RUNNER_TEMP/bench-new/bench.json" "$in/bench/$day.json"
      - name: Measure the mirror, upstream and the Worker
        run: scripts/status-collect "$RUNNER_TEMP/status"
      - name: Render the site
        run: |
          python3 --version
          python3 -I scripts/status-render "$RUNNER_TEMP/status" "$RUNNER_TEMP/site"
      - name: Push the site and the history to the status branch
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One orphan commit each run: the branch holds the current state,
          # and history.jsonl is the record of the runs.
          branch="$RUNNER_TEMP/branch"
          rm -rf "$branch"
          mkdir -p "$branch"
          cp -r "$RUNNER_TEMP/site/." "$branch/"
          cp "$RUNNER_TEMP/status/history.jsonl" "$RUNNER_TEMP/status/worker.md" "$branch/"
          if [ -f "$RUNNER_TEMP/status/bench.json" ]; then
            cp "$RUNNER_TEMP/status/bench.json" "$branch/bench.json"
          fi
          if [ -d "$RUNNER_TEMP/status/bench" ]; then
            cp -r "$RUNNER_TEMP/status/bench" "$branch/bench"
          fi
          touch "$branch/.nojekyll"
          generated="$(jq -r .generated "$branch/status.json")"
          cd "$branch"
          git init --quiet --initial-branch status
          git add -A
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "status: $generated"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            push --force --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" HEAD:refs/heads/status
          echo "status branch: $(git rev-parse HEAD), $(git ls-files | awk 'END { print NR }') file(s), measured $generated"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/site

  # Each of these names its needs' results: with no status function an if gets
  # an implicit success() over every job before it, and bench is skipped in
  # most runs.
  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check that Pages takes a workflow build
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/pages.json" 2> "$RUNNER_TEMP/pages.err" || rc=$?
          if [ "$rc" -eq 0 ]; then
            type="$(jq -r '.build_type // "unknown"' "$RUNNER_TEMP/pages.json")"
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/pages.err"; then
            type=disabled
          else
            cat "$RUNNER_TEMP/pages.err" >&2
            echo "::error::could not read the Pages settings: gh api ended $rc"
            echo "  reproduce: gh api repos/$GITHUB_REPOSITORY/pages"
            exit 1
          fi
          if [ "$type" = workflow ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pages is '$type', not a workflow build, so nothing is deployed. Enable it once: gh api -X POST repos/$GITHUB_REPOSITORY/pages -f build_type=workflow"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Pages
        id: deploy
        if: ${{ steps.pages.outputs.deploy == 'true' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact }}

  # The Worker check reads the record build has just pushed to the status
  # branch. Here, not in watchdog.yml: an hourly cron there would cancel a
  # pending daily run, which shares its concurrency group.
  worker:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Raise worker-down after failed probes in 2 runs in a row, over 50 minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # status.yml probes the Worker each hour, and once more after each
          # sync, so two runs can be minutes apart. scripts/status-collect
          # counts the runs in a row with a failed probe and the time since
          # the first; it sets worker.down when both reach its limits. This
          # reads its last record from the status branch.
          rc=0
          git ls-remote --exit-code --heads origin status > "$RUNNER_TEMP/heads.txt" || rc=$?
          case "$rc" in
            0) ;;
            2)
              echo "::notice::no status branch yet: status.yml has recorded no Worker probe"
              exit 0
              ;;
            *)
              echo "::error::git ls-remote origin status ended $rc"
              exit "$rc"
              ;;
          esac
          git fetch --quiet --depth 1 origin status
          git show FETCH_HEAD:status.json > "$RUNNER_TEMP/status.json"
          git show FETCH_HEAD:worker.md > "$RUNNER_TEMP/worker.md"
          read -r generated age failed ok down span <<< "$(jq -r '[.generated, (now - .generated_epoch | floor), .worker.failed_runs, .worker.ok, .worker.down, .worker.failing_seconds] | map(tostring) | join(" ")' "$RUNNER_TEMP/status.json")"
          echo "status.json from $generated, $age s ago: Worker ok $ok, failed $failed run(s) in a row over $span s, down $down"
          # Three status runs missed: the record says nothing about now.
          if [ "$age" -gt 10800 ]; then
            echo "::error::the last Worker probe is from $generated, $age s ago; status.yml has stopped recording"
            echo "  reproduce: git fetch origin status && git show FETCH_HEAD:status.json | jq '{generated, worker}'"
            exit 1
          fi
          if [ "$ok" = true ]; then
            scripts/track-issue clear worker-down "The Worker passes its probes again, measured $generated: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/status/worker.md"
          elif [ "$down" = true ]; then
            scripts/track-issue raise worker-down "The Worker fails its probe" "$RUNNER_TEMP/worker.md"
          else
            echo "nothing to raise or clear: worker-down opens at failed probes in 2 runs in a row over 50 minutes or more (status.json .worker.down_after)"
          fi
