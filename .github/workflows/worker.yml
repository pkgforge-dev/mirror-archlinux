# The Cloudflare Worker in worker/ (ghcr.mirror.archlinux.pkgforge.dev).
#
#   test     node --test 'worker/test/*.test.js' in the pinned node image
#
# CI does not deploy. The maintainer deploys by hand, after this passes:
#   cd worker && npx wrangler@4.150.0 deploy
#   WORKER_LIVE=1 tests/worker/live.sh
# The Worker holds no secret; the account id is in worker/wrangler.toml.
name: Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Worker tests in the pinned node image
        run: |
          # tag: 26-alpine
          image=docker.io/library/node:26-alpine@sha256:c6ad9e9c1d80f6eb607c26b4b0a132ff7a2344fad1c78ea3baa2a7d4c8de6d94
          docker run --rm -v "$PWD:/work:ro" -w /work "$image" node --test 'worker/test/*.test.js'
