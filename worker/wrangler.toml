# ghcr-mirror-archlinux-pkgforge: the HTTPS front for the GHCR mirror.
# Deploy: npx wrangler@4 deploy --config worker/wrangler.toml
name = "ghcr-mirror-archlinux-pkgforge"
main = "src/index.js"
account_id = "2a97c8f21aff7a773bf976c61ace1381"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "ghcr.mirror.archlinux.pkgforge.dev", custom_domain = true },
]

# Each request is a cache lookup and at most two small subrequests.
[limits]
cpu_ms = 50

[observability]
enabled = true
head_sampling_rate = 0.01
